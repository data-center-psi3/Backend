spring.config.import=optional:file:.env[.properties]
spring.application.name=brasil

# Porta utilizada pelo Render
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta

# Agent conversation memory and explicitly authorized local SQL diagnostics.
app.agent.debug-sql-enabled=${AGENT_DEBUG_SQL_ENABLED:false}
app.agent.memory.max-turns=${AGENT_MEMORY_MAX_TURNS:8}
app.agent.memory.max-chars=${AGENT_MEMORY_MAX_CHARS:60000}
app.agent.memory.ttl-days=${AGENT_MEMORY_TTL_DAYS:7}
